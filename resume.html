<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Resume — Factory Analytics Hub</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    .resume-wrap { padding: 0 12px 48px; }

    .resume-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 0 14px;
      flex-wrap: wrap;
    }
    @media (max-width: 640px) {
      .resume-status { width: 100%; order: 3; }
    }
    .resume-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      flex: 1;
    }
    .resume-status {
      font-size: 12px;
      color: var(--text-secondary, #888);
    }

    .tbl-scroll { overflow-x: auto; }

    .tbl-resume {
      border-collapse: collapse;
      width: max-content;
      min-width: 100%;
      font-size: 11.5px;
    }
    .tbl-resume th,
    .tbl-resume td {
      border: 1px solid #b0bac8;
      padding: 3px 6px;
      white-space: nowrap;
    }
    .tbl-resume thead th {
      background: var(--bg-secondary, #f5f6f8);
      font-weight: 600;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 3;
      border-bottom: 2px solid #7a8699;
    }

    /* Garis tebal sebagai pemisah antar grup/baris */
    .tbl-resume tr.row-group-start td,
    .tbl-resume tr.row-single td {
      border-top: 2px solid #8895a7;
    }
    .tbl-resume thead th.col-proses {
      text-align: left;
      min-width: 130px;
      max-width: 130px;
      position: sticky;
      left: 0;
      z-index: 4;
    }
    .tbl-resume thead th.col-sub  { min-width: 58px; max-width: 58px; position: sticky; left: 130px; z-index: 4; }
    .tbl-resume thead th.col-unit { min-width: 46px; max-width: 46px; position: sticky; left: 188px; z-index: 4; }
    .tbl-resume thead th.col-year { min-width: 66px; }

    .tbl-resume tbody td.cell-group {
      position: sticky;
      left: 0;
      z-index: 1;
      font-weight: 600;
      background: var(--bg-accent, #eef1f7);
      vertical-align: middle;
    }
    .tbl-resume tbody td.cell-sub {
      position: sticky;
      left: 130px;
      z-index: 1;
      background: #fff;
      color: var(--text-secondary, #666);
    }
    .tbl-resume tbody td.cell-unit {
      position: sticky;
      left: 188px;
      z-index: 1;
      background: #fff;
      text-align: center;
      color: var(--text-secondary, #666);
    }

    .tbl-resume td.cell-val {
      text-align: right;
      color: var(--text-muted, #aaa);
    }
    .tbl-resume td.cell-val.has-data {
      color: var(--text-primary, #222);
    }

    .tbl-resume tr.row-single td.cell-group { background: var(--bg-secondary, #f5f6f8); }
    .tbl-resume tr.row-single td.cell-sub,
    .tbl-resume tr.row-single td.cell-unit  { background: var(--bg-secondary, #f5f6f8); }

    .tbl-resume tr.row-total td            { background: var(--bg-total, #e8f4e8) !important; font-weight: 600; }
    .tbl-resume tr.row-total td.cell-sub,
    .tbl-resume tr.row-total td.cell-unit  { background: var(--bg-total, #e8f4e8) !important; }

    .tbl-resume tr.row-battery td { font-style: italic; }

    .tbl-resume tbody tr:hover td { filter: brightness(0.96); }
  </style>
</head>
<body>
<div class="app-layout">
  <div id="sidebarMount"></div>

  <div class="main-content">
    <div id="topbarMount"></div>

    <div class="page-body">
      <div class="resume-wrap">
        <div class="resume-toolbar">
          <span class="resume-title">Resume Produksi</span>
          <span class="resume-status" id="loadStatus"></span>
          <button class="btn btn-ghost btn-sm" id="reloadBtn" onclick="reloadResume()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
            </svg>
            Muat Ulang
          </button>
          <button class="btn btn-ghost btn-sm" onclick="exportTable()">Export Excel</button>
        </div>

        <div class="tbl-scroll">
          <table class="tbl-resume" id="resumeTable">
            <thead>
              <tr id="yearHeader">
                <th class="col-proses">Proses</th>
                <th class="col-sub">Sub</th>
                <th class="col-unit">Satuan</th>
              </tr>
            </thead>
            <tbody id="resumeTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="shared-components.js"></script>
<script src="new_jis_series_data.js"></script><!-- dibutuhkan lookup series di agregat terpusat -->
<script>
/* Loading data + agregasi kini terpusat di BPMS.loadProdAggregates (shared-components.js) */

/* ── Table structure ── */
const YEARS = [2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025];

const RESUME_STRUCTURE = [
  { label:'Plate/battery',      type:'single', unit:'panel', key:'plateBattery' },
  { label:'Berat lead/battery', type:'single', unit:'kg',    key:'beratLeadBattery' },
  { label:'Berat lead/panel',   type:'single', unit:'kg',    key:'beratLeadPanel' },
  { label:'Assembling',         type:'single', unit:'pcs',   key:'assembling' },
  { label:'Grid Casting',    type:'group', key:'gridCasting', rows:[
    { sub:'Pos',     unit:'panel',                   subKey:'pos' },
    { sub:'Neg',     unit:'panel',                   subKey:'neg' },
    { sub:'Total',   unit:'panel', isTotal:true,     subKey:'total' },
    { sub:'Battery', unit:'pcs',   isBattery:true,   subKey:'battery' },
  ]},
  { label:'Grid Punching',   type:'group', key:'gridPunching', rows:[
    { sub:'Pos',     unit:'panel',                   subKey:'pos' },
    { sub:'Neg',     unit:'panel',                   subKey:'neg' },
    { sub:'Total',   unit:'panel', isTotal:true,     subKey:'total' },
    { sub:'Battery', unit:'pcs',   isBattery:true,   subKey:'battery' },
  ]},
  { label:'Ball Mill',       type:'group', key:'ballMill', rows:[
    { sub:'Pos',     unit:'kg',                      subKey:'pos' },
    { sub:'Neg',     unit:'kg',                      subKey:'neg' },
    { sub:'Total',   unit:'kg',    isTotal:true,     subKey:'total' },
    { sub:'Battery', unit:'pcs',   isBattery:true,   subKey:'battery' },
  ]},
  { label:'Pasting Casting', type:'group', key:'pastingCasting', rows:[
    { sub:'Pos',     unit:'panel',                   subKey:'pos' },
    { sub:'Neg',     unit:'panel',                   subKey:'neg' },
    { sub:'Total',   unit:'panel', isTotal:true,     subKey:'total' },
    { sub:'Battery', unit:'pcs',   isBattery:true,   subKey:'battery' },
  ]},
  { label:'Pasting Punching', type:'group', key:'pastingPunching', rows:[
    { sub:'Pos',     unit:'panel',                   subKey:'pos' },
    { sub:'Neg',     unit:'panel',                   subKey:'neg' },
    { sub:'Total',   unit:'panel', isTotal:true,     subKey:'total' },
    { sub:'Battery', unit:'pcs',   isBattery:true,   subKey:'battery' },
  ]},
  { label:'Formation',       type:'group', key:'formation', rows:[
    { sub:'Pos',     unit:'panel',                   subKey:'pos' },
    { sub:'Neg',     unit:'panel',                   subKey:'neg' },
    { sub:'Total',   unit:'panel', isTotal:true,     subKey:'total' },
    { sub:'Battery', unit:'pcs',   isBattery:true,   subKey:'battery' },
  ]},
  { label:'Asam Sulfat',     type:'group', key:'asamSulfat', rows:[
    { sub:'Pos',     unit:'kg',                      subKey:'pos' },
    { sub:'Neg',     unit:'kg',                      subKey:'neg' },
    { sub:'Total',   unit:'kg',    isTotal:true,     subKey:'total' },
    { sub:'Battery', unit:'pcs',   isBattery:true,   subKey:'battery' },
  ]},
];

/* ── Helpers ── */
function rowKey(item, sr) {
  return sr ? `${item.key}_${sr.subKey}` : item.key;
}

function fmt(n) {
  if (n === null || n === undefined || n === '') return '—';
  return Number(n).toLocaleString('id-ID');
}

function fmtDec(n, d = 4) {
  if (n === null || n === undefined || n === '') return '—';
  return Number(n).toLocaleString('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d });
}

function emptyCells(rk) {
  return YEARS.map(y =>
    `<td class="cell-val" data-rowkey="${rk}" data-year="${y}">—</td>`
  ).join('');
}

function fillCell(rk, year, value, isDecimal) {
  const td = document.querySelector(`td[data-rowkey="${rk}"][data-year="${year}"]`);
  if (!td) return;
  const display = isDecimal ? fmtDec(value) : fmt(value);
  td.textContent = display;
  if (value !== null && value !== undefined && value !== '' && value !== 0) {
    td.classList.add('has-data');
  }
}

/* ── Build table DOM ── */
function buildTable() {
  const hRow = document.getElementById('yearHeader');
  YEARS.forEach(y => {
    const th = document.createElement('th');
    th.className = 'col-year';
    th.textContent = y;
    hRow.appendChild(th);
  });

  const parts = [];
  for (const item of RESUME_STRUCTURE) {
    if (item.type === 'single') {
      const rk = rowKey(item);
      parts.push(`<tr class="row-single" data-rowkey="${rk}">
        <td class="cell-group">${item.label}</td>
        <td class="cell-sub"></td>
        <td class="cell-unit">${item.unit}</td>
        ${emptyCells(rk)}
      </tr>`);
    } else {
      item.rows.forEach((sr, i) => {
        const rk = rowKey(item, sr);
        const groupTd = i === 0
          ? `<td class="cell-group" rowspan="${item.rows.length}">${item.label}</td>`
          : '';
        const trClass = [i === 0 ? 'row-group-start' : '', sr.isTotal ? 'row-total' : sr.isBattery ? 'row-battery' : ''].filter(Boolean).join(' ');
        parts.push(`<tr class="${trClass}" data-rowkey="${rk}">
          ${groupTd}
          <td class="cell-sub">${sr.sub}</td>
          <td class="cell-unit">${sr.unit}</td>
          ${emptyCells(rk)}
        </tr>`);
      });
    }
  }
  document.getElementById('resumeTbody').innerHTML = parts.join('');
}

/* ── Data loading & computation ──
   Data + agregasi kini terpusat di BPMS.loadProdAggregates (shared-components.js):
   cek versi data ke server → pakai cache localStorage bila tidak berubah →
   download & hitung ulang (single-pass) hanya bila data berubah / force. */
async function loadResumeData(force = false) {
  document.getElementById('loadStatus').textContent = 'Memuat data…';
  try {
    const res = await BPMS.loadProdAggregates({ force });
    const Y   = res.years || {};

    if (!Object.keys(Y).length) {
      document.getElementById('loadStatus').textContent = 'Belum ada data Produksi Infor maupun BaaN.';
      return;
    }

    for (const y of YEARS) {
      const a = Y[String(y)];
      if (!a) continue;
      const gcT = a.gcPos + a.gcNeg;
      const gpT = a.gpPos + a.gpNeg;
      const bmT = a.bmPos + a.bmNeg;
      const fmT = a.fmPos + a.fmNeg;

      if (a.asm)   fillCell('assembling', y, Math.round(a.asm));

      if (a.gcPos) fillCell('gridCasting_pos',   y, Math.round(a.gcPos));
      if (a.gcNeg) fillCell('gridCasting_neg',   y, Math.round(a.gcNeg));
      if (gcT)     fillCell('gridCasting_total', y, Math.round(gcT));

      if (a.gpPos) fillCell('gridPunching_pos',   y, Math.round(a.gpPos));
      if (a.gpNeg) fillCell('gridPunching_neg',   y, Math.round(a.gpNeg));
      if (gpT)     fillCell('gridPunching_total', y, Math.round(gpT));

      if (a.bmPos) fillCell('ballMill_pos',   y, Math.round(a.bmPos));
      if (a.bmNeg) fillCell('ballMill_neg',   y, Math.round(a.bmNeg));
      if (bmT)     fillCell('ballMill_total', y, Math.round(bmT));

      /* Pasting Casting/Punching = sama dengan Grid Casting/Punching */
      if (a.gcPos) fillCell('pastingCasting_pos',   y, Math.round(a.gcPos));
      if (a.gcNeg) fillCell('pastingCasting_neg',   y, Math.round(a.gcNeg));
      if (gcT)     fillCell('pastingCasting_total', y, Math.round(gcT));
      if (a.gpPos) fillCell('pastingPunching_pos',   y, Math.round(a.gpPos));
      if (a.gpNeg) fillCell('pastingPunching_neg',   y, Math.round(a.gpNeg));
      if (gpT)     fillCell('pastingPunching_total', y, Math.round(gpT));

      if (a.fmPos) fillCell('formation_pos',   y, Math.round(a.fmPos));
      if (a.fmNeg) fillCell('formation_neg',   y, Math.round(a.fmNeg));
      if (fmT)     fillCell('formation_total', y, Math.round(fmT));

      /* Parameter turunan */
      const plateBattery     = a.asm ? (gcT + gpT) / a.asm : 0;
      const beratLeadBattery = a.asm ? bmT / a.asm : 0;
      const beratLeadPanel   = (gcT + gpT) ? bmT / (gcT + gpT) : 0;
      if (plateBattery)            fillDecCell('plateBattery',     y, plateBattery, 1);
      if (beratLeadBattery && bmT) fillDecCell('beratLeadBattery', y, beratLeadBattery, 1);
      if (beratLeadPanel && bmT)   fillDecCell('beratLeadPanel',   y, beratLeadPanel, 3);

      /* Baris Battery */
      if (plateBattery) {
        fillCell('gridCasting_battery',     y, Math.round(gcT / plateBattery));
        fillCell('gridPunching_battery',    y, Math.round(gpT / plateBattery));
        fillCell('pastingCasting_battery',  y, Math.round(gcT / plateBattery));
        fillCell('pastingPunching_battery', y, Math.round(gpT / plateBattery));
        if (fmT) fillCell('formation_battery', y, Math.round(fmT / plateBattery));
      }
      if (beratLeadBattery && bmT) {
        fillCell('ballMill_battery', y, Math.round(bmT / beratLeadBattery));
      }
    }

    const m = res.meta || {};
    let status = `Infor: ${(m.inforCount || 0).toLocaleString('id-ID')} record (${m.inforPeriods || 0} periode) · BaaN: ${(m.baanCount || 0).toLocaleString('id-ID')} record`;
    if (res.fromCache) status += res.offline ? ' · cache (server tidak terjangkau)' : ' · dari cache';
    document.getElementById('loadStatus').textContent = status;
  } catch (err) {
    document.getElementById('loadStatus').textContent = `Gagal memuat data: ${err.message}`;
  }
}

/* Isi sel desimal (Plate/battery, Berat lead/battery, Berat lead/panel) */
function fillDecCell(rk, year, value, dec) {
  const td = document.querySelector(`td[data-rowkey="${rk}"][data-year="${year}"]`);
  if (!td) return;
  td.textContent = value.toLocaleString('id-ID', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  td.classList.add('has-data');
}

/* ── Export ── */
function exportTable() {
  if (typeof XLSX === 'undefined') { alert('Library XLSX belum dimuat'); return; }
  const wb = XLSX.utils.table_to_book(document.getElementById('resumeTable'), { sheet:'Resume' });
  XLSX.writeFile(wb, 'Resume_Produksi.xlsx');
}

/* ── Reload (force: abaikan cache, ambil segar dari server) ── */
async function reloadResume() {
  const btn = document.getElementById('reloadBtn');
  btn.disabled = true;
  // Reset semua sel ke "—" sebelum hitung ulang
  document.querySelectorAll('#resumeTbody td[data-year]').forEach(td => {
    td.textContent = '—';
    td.classList.remove('has-data');
  });
  await loadResumeData(true);
  btn.disabled = false;
}

/* ── Init ── */
async function pageInit() {
  document.getElementById('topbarMount').innerHTML = BPMS.renderTopbar('Resume');
  buildTable();
  await loadResumeData();
}
</script>
</body>
</html>
