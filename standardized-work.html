<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standardized Work — Factory Analytics Hub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="sw/sw.css">
</head>
<!-- Modul Standardized Work: satu halaman, view per hash (#observasi, #tskk, ...) dari <template id="tpl-...">.
     Sidebar dari shared-components.js (FAH); data disimpan terpisah via api/sw-state.php. -->
<body class="sw-portal" data-page="home" data-bpms-sync="off">
  <div class="app-layout">
    <div id="sidebarMount"></div>

    <div class="main-content">
      <div class="topbar">
        <button type="button" class="hamburger-btn" id="hamburgerBtn" aria-label="Buka menu">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M1 3h14v1.5H1V3zm0 4.5h14V9H1V7.5zm0 4.5h14v1.5H1V12z"/></svg>
        </button>
        <span class="topbar-title" id="topbarTitle">Dashboard</span>
        <span class="topbar-sub" id="topbarSub"></span>
        <div class="topbar-actions" id="topbarActions"></div>
      </div>
      <main class="page-body" id="appView"></main>
    </div>
  </div>

  <!-- ══════════════════ VIEW: Dashboard ══════════════════ -->
  <template id="tpl-home">
    <header class="page-header">
      <h2>Dashboard Standardized Work</h2>
      <p>Ringkasan data shopfloor dan akses cepat ke semua tools standardized work.</p>
    </header>


    <section class="card-grid">
      <article class="card stat-card">
        <h3>Total Proses</h3>
        <p id="homeProcessCount" class="stat-value">0</p>
      </article>
      <article class="card stat-card">
        <h3>Total Operator</h3>
        <p id="homeOperatorCount" class="stat-value">0</p>
      </article>
      <article class="card stat-card">
        <h3>Rata-rata Cycle Time</h3>
        <p id="homeAvgCycle" class="stat-value">0 detik</p>
      </article>
      <article class="card stat-card">
        <h3>Data Aktif</h3>
        <p id="homeActiveData" class="stat-value">Belum dipilih</p>
      </article>
    </section>

    <section class="card">
      <div class="card-header">
        <h3>Data Observasi Terakhir</h3>
        <a class="text-link" href="#observasi">Input data baru</a>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Proses</th>
              <th>Operator</th>
              <th>Cycle Time (detik)</th>
              <th>Tanggal</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="homeLatestBody">
            <tr>
              <td colspan="5" class="placeholder">Belum ada data observasi.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </template>

  <!-- ══════════════════ VIEW: Lembar Observasi ══════════════════ -->
  <template id="tpl-observasi">
    <header class="page-header">
      <h2>Lembar Observasi</h2>
      <p>Masukkan data elemen kerja dan waktu sample. Data tersimpan otomatis.</p>
    </header>


    <section class="card hidden" id="lineImportSection">
      <div class="card-header">
        <div>
          <h3 id="lineImportTitle">Pratinjau Import Form 1 Line</h3>
          <p class="helper-text">Periksa daftar proses di bawah. Hilangkan centang untuk proses yang tidak ingin disimpan.</p>
        </div>
      </div>
      <div id="lineImportSummary" class="obs-revision-summary line-import-summary"></div>
      <p id="lineImportWarn" class="line-import-warn hidden"></p>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th class="line-import-check"><input type="checkbox" id="lineImportAll" checked aria-label="Pilih semua proses"></th>
              <th>No</th>
              <th>Proses</th>
              <th>Operator</th>
              <th>Jumlah Elemen</th>
              <th>Total CT (sec/batt)</th>
              <th>Status Simpan</th>
            </tr>
          </thead>
          <tbody id="lineImportBody"></tbody>
        </table>
      </div>
      <label id="lineImportNoteWrap" class="line-import-note hidden">
        Catatan revisi (untuk proses yang sudah ada)
        <input id="lineImportNote" type="text" maxlength="160">
      </label>
      <div class="obs-action-group line-import-actions">
        <button type="button" id="lineImportSaveBtn" class="btn primary">Simpan</button>
        <button type="button" id="lineImportCancelBtn" class="btn ghost">Batal</button>
      </div>
    </section>

    <section class="card">
      <div class="card-header">
        <h3>Input Observasi Baru</h3>
        <div class="obs-action-group">
          <button type="button" id="downloadObservasiFormBtn" class="btn ghost">Form Excel 1 Proses</button>
          <button type="button" id="downloadObservasiLineFormBtn" class="btn ghost">Form Excel 1 Line</button>
          <label class="btn file-btn" for="importObservasiInput">
            Import Excel
            <input id="importObservasiInput" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
          </label>
        </div>
      </div>
      <div class="obs-sheet-wrapper">
        <table class="obs-sheet-table">
          <tbody>
            <tr>
              <td class="obs-logo-cell" rowspan="4">
                <img src="sw/CBI_Logo_large1.png" alt="Logo CBI" class="obs-logo-image">
                <div class="obs-logo-name">PT. Century Batteries Indonesia</div>
              </td>

              <td class="obs-title-cell" colspan="2" rowspan="3">LEMBAR OBSERVASI</td>

              <td class="obs-field-label">LINE</td>
              <td class="obs-field-input">
                <input id="lineName" type="text" placeholder="Contoh: Line 1">
              </td>

              <td class="obs-field-label">TANGGAL</td>
              <td class="obs-field-input">
                <input id="obsTanggal" type="date">
              </td>
            </tr>

            <tr>
              <td class="obs-field-label">PROSES</td>
              <td class="obs-field-input">
                <input id="processName" type="text" placeholder="Contoh: Assembly A">
              </td>

              <td class="obs-field-label">SHIFT / JAM</td>
              <td class="obs-field-input">
                <input id="shiftJam" type="text" placeholder="Contoh: Shift 1 / 07:00-15:00">
              </td>
            </tr>

            <tr>
              <td class="obs-field-label">TIPE PRODUK</td>
              <td class="obs-field-input">
                <input id="productType" type="text" placeholder="Contoh: NS40Z">
              </td>

              <td class="obs-field-label">NAMA OBSERVER</td>
              <td class="obs-field-input">
                <input id="observerName" type="text" placeholder="Contoh: Andi">
              </td>
            </tr>

            <tr>
              <td class="obs-field-label">NO FORM</td>
              <td class="obs-fixed-cell">
                <span id="noFormValue" class="obs-fixed-value">Form-ISD-ISD-001</span>
              </td>

              <td class="obs-field-label">TAKT TIME</td>
              <td class="obs-field-input">
                <input id="taktTimeInput" type="number" min="0" step="0.01" placeholder="Detik">
              </td>

              <td class="obs-field-label">NAMA OPERATOR</td>
              <td class="obs-field-input">
                <input id="operatorName" type="text" placeholder="Contoh: Budi">
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="table-toolbar">
        <button id="addObservasiRowBtn" class="btn">Tambah Elemen</button>
        <button id="clearObservasiDraftBtn" class="btn ghost">Bersihkan Draft</button>
      </div>

      <div class="table-wrapper obs-entry-table-wrap">
        <table class="obs-detail-table">
          <thead>
            <tr>
              <th rowspan="2" class="obs-col-no">NO</th>
              <th rowspan="2" class="obs-col-elemen">Elemen Kerja</th>
              <th rowspan="2" class="obs-col-kategori obs-divider-right">Kategori</th>
              <th colspan="10" class="obs-col-sample-group obs-divider-right">Sample</th>
              <th rowspan="2" class="obs-col-stat">Modus <span class="modus-info">ⓘ</span></th>
              <th rowspan="2" class="obs-col-stat">Min</th>
              <th rowspan="2" class="obs-col-stat obs-divider-right">Max</th>
              <th colspan="2" class="obs-col-qty-group obs-divider-right">Qty</th>
              <th rowspan="2" class="obs-col-ct obs-divider-right">CT<br>(sec/batt)</th>
              <th rowspan="2" class="obs-col-note">NOTE</th>
            </tr>
            <tr>
              <th class="obs-col-sample">1</th>
              <th class="obs-col-sample">2</th>
              <th class="obs-col-sample">3</th>
              <th class="obs-col-sample">4</th>
              <th class="obs-col-sample">5</th>
              <th class="obs-col-sample">6</th>
              <th class="obs-col-sample">7</th>
              <th class="obs-col-sample">8</th>
              <th class="obs-col-sample">9</th>
              <th class="obs-col-sample obs-divider-right">10</th>
              <th class="obs-col-qty">Qty</th>
              <th class="obs-col-unit obs-divider-right">Unit</th>
            </tr>
          </thead>
          <tbody id="observasiRows"></tbody>
          <tfoot>
            <tr id="observasiTotalRow"></tr>
          </tfoot>
        </table>
      </div>

      <div class="summary-block">
        <p>Total Elemen: <strong id="observasiTotalElemen">0</strong></p>
        <p>Total CT: <strong id="observasiTotalCycle">0</strong> sec/batt</p>
      </div>

      <button id="saveObservasiBtn" class="btn primary">Simpan Observasi</button>
    </section>
  </template>

  <!-- ══════════════════ VIEW: Data Observasi ══════════════════ -->
  <template id="tpl-data-observasi">
    <header class="page-header do-page-header">
      <div>
        <h2>Data Observasi</h2>
        <p>Pilih Line → Type Produk → Proses untuk membuka lembar observasi, lalu print, export, atau buat revisi.</p>
      </div>
      <div class="obs-action-group" style="flex-shrink:0;">
        <button id="dataExportBtn" class="btn">Export Data</button>
        <label class="btn file-btn" for="dataImportInput">
          Import Data
          <input id="dataImportInput" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
        </label>
      </div>
    </header>


    <nav id="doBreadcrumb" class="do-breadcrumb no-print" aria-label="Navigasi Data Observasi"></nav>

    <!-- Daftar bertingkat: Line → Type Produk → Proses (isi tabel diganti per tingkat) -->
    <section class="card" id="doBrowseSection">
      <div class="card-header">
        <div>
          <h3 id="doBrowseTitle">Data Observasi Tersimpan</h3>
          <p id="doBrowseHint" class="helper-text do-browse-hint"></p>
        </div>
        <div class="obs-action-group">
          <button type="button" id="doBackBtn" class="btn ghost hidden">&larr; Kembali</button>
          <a href="#observasi" class="btn ghost">Input Observasi Baru</a>
          <button id="generateDummyObservasiBtn" class="btn do-top-only">Generate Dummy 7 Line</button>
          <button id="clearAllDataBtn" class="btn danger do-top-only">Hapus Semua Data</button>
        </div>
      </div>
      <div class="table-wrapper">
        <table class="do-browse-table">
          <thead id="doBrowseHead"></thead>
          <tbody id="doBrowseBody"></tbody>
        </table>
      </div>
    </section>

    <section class="card hidden" id="savedDetailSection">
      <div class="card-header">
        <h3 id="savedDetailTitle">Detail Observasi</h3>
        <div class="obs-action-group no-print">
          <button type="button" id="detailBackBtn" class="btn ghost">&larr; Kembali</button>
          <button id="detailCreateRevisionBtn" class="btn primary">Buat Revisi</button>
          <button id="detailPrintBtn" class="btn">Print (A4 / PDF)</button>
          <button id="detailExportXlsxBtn" class="btn">Export Excel (.xlsx)</button>
        </div>
      </div>

      <div class="obs-revision-summary">
        <div class="obs-revision-summary-item">
          <span>Revisi</span>
          <strong id="detailRevisionLabel">-</strong>
        </div>
        <div class="obs-revision-summary-item">
          <span>Status</span>
          <strong id="detailRevisionStatus">-</strong>
        </div>
        <div class="obs-revision-summary-item obs-revision-summary-note">
          <span>Catatan Revisi</span>
          <strong id="detailRevisionNote">-</strong>
        </div>
      </div>

      <div id="observasiDetailPrintArea" class="obs-print-area">
        <div class="obs-sheet-wrapper obs-sheet-readonly">
          <table class="obs-sheet-table">
            <tbody>
              <tr>
                <td class="obs-logo-cell" rowspan="4">
                  <img src="sw/CBI_Logo_large1.png" alt="Logo CBI" class="obs-logo-image">
                  <div class="obs-logo-name">PT. Century Batteries Indonesia</div>
                </td>

                <td class="obs-title-cell" colspan="2" rowspan="3">LEMBAR OBSERVASI</td>

                <td class="obs-field-label">LINE</td>
                <td class="obs-field-input">
                  <span id="detailLine" class="obs-field-static">-</span>
                </td>

                <td class="obs-field-label">TANGGAL</td>
                <td class="obs-field-input">
                  <span id="detailTanggal" class="obs-field-static">-</span>
                </td>
              </tr>

              <tr>
                <td class="obs-field-label">PROSES</td>
                <td class="obs-field-input">
                  <span id="detailProses" class="obs-field-static">-</span>
                </td>

                <td class="obs-field-label">SHIFT / JAM</td>
                <td class="obs-field-input">
                  <span id="detailShift" class="obs-field-static">-</span>
                </td>
              </tr>

              <tr>
                <td class="obs-field-label">TIPE PRODUK</td>
                <td class="obs-field-input">
                  <span id="detailProduct" class="obs-field-static">-</span>
                </td>

                <td class="obs-field-label">NAMA OBSERVER</td>
                <td class="obs-field-input">
                  <span id="detailObserver" class="obs-field-static">-</span>
                </td>
              </tr>

              <tr>
                <td class="obs-field-label">NO FORM</td>
                <td class="obs-fixed-cell">
                  <span id="detailNoForm" class="obs-fixed-value">Form-ISD-ISD-001</span>
                </td>

                <td class="obs-field-label">TAKT TIME</td>
                <td class="obs-field-input">
                  <span id="detailTakt" class="obs-field-static">-</span>
                </td>

                <td class="obs-field-label">NAMA OPERATOR</td>
                <td class="obs-field-input">
                  <span id="detailOperator" class="obs-field-static">-</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="table-wrapper obs-print-table-wrap">
          <table class="obs-detail-table">
            <thead>
              <tr>
                <th rowspan="2" class="obs-col-no">NO</th>
                <th rowspan="2" class="obs-col-elemen">Elemen Kerja</th>
                <th rowspan="2" class="obs-col-kategori obs-divider-right">Kategori</th>
                <th colspan="10" class="obs-col-sample-group obs-divider-right">Sample</th>
                <th rowspan="2" class="obs-col-stat">Modus <span class="modus-info">ⓘ</span></th>
                <th rowspan="2" class="obs-col-stat">Min</th>
                <th rowspan="2" class="obs-col-stat obs-divider-right">Max</th>
                <th colspan="2" class="obs-col-qty-group obs-divider-right">Qty</th>
                <th rowspan="2" class="obs-col-ct obs-divider-right">CT<br>(sec/batt)</th>
                <th rowspan="2" class="obs-col-note">NOTE</th>
              </tr>
              <tr>
                <th class="obs-col-sample">1</th>
                <th class="obs-col-sample">2</th>
                <th class="obs-col-sample">3</th>
                <th class="obs-col-sample">4</th>
                <th class="obs-col-sample">5</th>
                <th class="obs-col-sample">6</th>
                <th class="obs-col-sample">7</th>
                <th class="obs-col-sample">8</th>
                <th class="obs-col-sample">9</th>
                <th class="obs-col-sample obs-divider-right">10</th>
                <th class="obs-col-qty">Qty</th>
                <th class="obs-col-unit obs-divider-right">Unit</th>
              </tr>
            </thead>
            <tbody id="savedDetailRows">
              <tr>
                <td colspan="20" class="placeholder">Pilih tombol Detail pada data tersimpan.</td>
              </tr>
            </tbody>
            <tfoot>
              <tr id="savedDetailTotalRow"></tr>
            </tfoot>
          </table>
        </div>
      </div>

      <div class="obs-revision-history">
        <h4>Riwayat Revisi</h4>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Revisi</th>
                <th>Tanggal / Jam</th>
                <th>Status</th>
                <th>Observer</th>
                <th>Catatan Revisi</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="revisionHistoryBody">
              <tr>
                <td colspan="6" class="placeholder">Pilih detail observasi untuk melihat riwayat revisi.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </template>

  <!-- ══════════════════ VIEW: TSKK ══════════════════ -->
  <template id="tpl-tskk">
    <header class="page-header">
      <h2>Tabel Standar Kerja Kombinasi (TSKK)</h2>
    </header>


    <!-- Controls -->
    <div class="tskk-controls card" style="padding:12px 16px;">
      <label>
        Line
        <select id="tskkLineSelect"></select>
      </label>
      <label>
        Type Produk
        <select id="tskkProductSelect"></select>
      </label>
      <label>
        Proses
        <select id="tskkObsSelect"></select>
      </label>
      <button id="tskkGenerateBtn" class="btn primary">Generate TSKK</button>
      <button id="tskkPrintBtn" class="btn">Print</button>
      <button id="tskkExportBtn" class="btn">Export Excel (.xlsx)</button>
    </div>

    <!-- ══ TSKK Printable Form ══ -->
    <div id="tskkForm" class="tskk-form">

      <!-- Header — 11 kolom: Logo|TitleL|TitleR|LblKanan|CTsym|CTval|TargetLbl|TargetVal|Diketh|Diper|Dibuat -->
      <table class="tskk-hdr">
        <tbody>
          <!-- Row 1 -->
          <tr>
            <td rowspan="6" class="hdr-logo">
              <img src="sw/CBI_Logo_large1.png" alt="Logo CBI" class="tskk-logo-img">
              <div class="tskk-logo-name">PT. Century Batteries Indonesia</div>
            </td>
            <td colspan="2" rowspan="3" class="hdr-title">TABEL STANDAR KERJA KOMBINASI</td>
            <td class="hdr-lbl">Line</td>
            <td colspan="2" id="tskkHdrLine">-</td>
            <td class="hdr-lbl-sm">Target Produksi Per Shift</td>
            <td id="tskkHdrTarget" style="font-weight:700; text-align:center;">-</td>
            <td rowspan="6" class="hdr-approval">Diketahui</td>
            <td rowspan="6" class="hdr-approval">Diperiksa</td>
            <td rowspan="6" class="hdr-approval">Dibuat</td>
          </tr>
          <!-- Row 2 -->
          <tr>
            <td class="hdr-lbl">Proses</td>
            <td colspan="2" id="tskkHdrProsesSmall">-</td>
            <td colspan="2" rowspan="2" class="hdr-proses-big" id="tskkHdrProses">-</td>
          </tr>
          <!-- Row 3 -->
          <tr>
            <td class="hdr-lbl">Model/Tipe</td>
            <td colspan="2" id="tskkHdrModel">-</td>
          </tr>
          <!-- Row 4 -->
          <tr>
            <td class="hdr-lbl">No Document</td>
            <td>Form-ISD-ISD-002</td>
            <td class="hdr-lbl">Cycle Time</td>
            <td class="hdr-ct-sym"></td>
            <td id="tskkHdrCt" style="font-weight:700; text-align:center;">-</td>
            <td colspan="2" rowspan="2"></td>
          </tr>
          <!-- Row 5 -->
          <tr>
            <td class="hdr-lbl">Revisi</td>
            <td style="text-align:center;">0</td>
            <td class="hdr-lbl">Takt Time</td>
            <td class="hdr-tt-sym"></td>
            <td id="tskkHdrTt" style="font-weight:700; text-align:center;">-</td>
          </tr>
          <!-- Row 6 — Tanggal + Legend -->
          <tr>
            <td class="hdr-lbl">Tanggal</td>
            <td id="tskkHdrTanggal" style="text-align:center;">-</td>
            <td colspan="2" class="hdr-legend">
              <span class="hleg-label">Manual :</span><span class="hleg-manual"></span>
            </td>
            <td colspan="2" class="hdr-legend">
              <span class="hleg-label">Auto :</span><span class="hleg-auto"></span>
            </td>
            <td class="hdr-legend">
              <span class="hleg-label">Walking :</span><span class="hleg-walk"></span>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Main table + timing chart -->
      <div class="tskk-body-wrap">
        <table class="tskk-data-table" id="tskkDataTable">
          <colgroup>
            <col class="col-no">
            <col class="col-uraian">
            <col class="col-waktu">
            <col class="col-waktu">
            <col class="col-waktu">
          </colgroup>
          <thead>
            <tr>
              <th rowspan="2">No</th>
              <th rowspan="2">Uraian Pekerjaan</th>
              <th colspan="3">Waktu</th>
            </tr>
            <tr>
              <th>Manual</th>
              <th>Auto</th>
              <th>Walking</th>
            </tr>
          </thead>
          <tbody id="tskkRows">
            <!-- 20 rows rendered by JS -->
          </tbody>
          <tfoot>
            <tr>
              <td colspan="2">Total</td>
              <td id="tskkTotalManual">0</td>
              <td id="tskkTotalAuto">0</td>
              <td id="tskkTotalWalking">0</td>
            </tr>
          </tfoot>
        </table>

        <div class="tskk-chart-wrap" id="tskkChartWrap">
          <canvas id="tskkChartCanvas"></canvas>
        </div>
      </div>

    </div><!-- /tskk-form -->
  </template>

  <!-- ══════════════════ VIEW: TSK ══════════════════ -->
  <template id="tpl-tsk">
    <header class="page-header">
      <h2>Tabel Standar Kerja (TSK)</h2>
      <p>Satu lembar per proses: layout area kerja, urutan pekerjaan, dan waktu tiap pekerjaan (Form-ISD-ISD-003).</p>
    </header>

    <section class="card tsk-controls no-print">
      <div class="form-inline">
        <label>
          Line
          <select id="tskLineSelect"></select>
        </label>
        <label>
          Type Produk
          <select id="tskProductSelect"></select>
        </label>
        <label>
          Proses
          <select id="tskProcessSelect"></select>
        </label>
        <button type="button" id="tskPrintBtn" class="btn">Print</button>
      </div>
      <div class="tsk-tools">
        <span class="tsk-tools-label">Layout</span>
        <button type="button" class="btn ghost" data-tsk-add="box">+ Mesin / Area</button>

  <template id="tpl-tskp">
